<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWWA Now Showing</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<style>
/* Fonts are stored locally in assets/fonts so the board works offline */
@font-face{font-family:'Tilt Neon';font-weight:400;font-display:block;src:url(assets/fonts/tiltneon-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Creepster';font-weight:400;font-display:block;src:url(assets/fonts/creepster-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Cinzel';font-weight:400 900;font-display:block;src:url(assets/fonts/cinzel-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Cinzel';font-weight:400 900;font-display:block;src:url(assets/fonts/cinzel-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Oswald';font-weight:200 700;font-display:block;src:url(assets/fonts/oswald-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Oswald';font-weight:200 700;font-display:block;src:url(assets/fonts/oswald-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
/* ============================================================
   EDIT HERE: posters, logos and timing are in the <script> at the bottom.
   ============================================================ */
:root{
  --blood:#c8102e;
  --blood-glow:#ff2a3d;
  --ink:#f4ece4;
  --muted:#c9b8ad;
  --pad:2.6vh;            /* width of the bulb frame around the poster */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050002;color:var(--ink);font-family:'Oswald',sans-serif}
body.idle{cursor:none}

#stage{position:fixed;inset:0;overflow:hidden}

/* ---------- VELVET CURTAIN (drawn on a canvas, see script) ---------- */
canvas#curtain{position:absolute;inset:0;width:100%;height:100%;z-index:1}

/* darkness + spotlight */
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse 55% 70% at 50% 50%,rgba(0,0,0,.25) 0%,rgba(0,0,0,.5) 60%,rgba(0,0,0,.88) 100%)}
.spot{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse 28% 50% at 50% 50%,rgba(255,60,60,.10),transparent 70%);
  animation:spot 7s ease-in-out infinite}
@keyframes spot{0%,100%{opacity:.7}50%{opacity:1}}

/* stage fog along the floor: pale, low, soft gradients only (no blur filter).
   Each layer is two screen-wide tiles side by side and slides exactly one tile,
   so the loop restarts without a jump. */
.fog{position:absolute;left:0;width:200%;z-index:4;pointer-events:none;will-change:transform;
  background-repeat:repeat-x;background-size:50% 100%}
.fog.a{bottom:-4%;height:24%;                         /* dense band hugging the floor */
  background-image:
    radial-gradient(ellipse 30% 70% at 18% 100%,rgba(215,210,220,.26),transparent 72%),
    radial-gradient(ellipse 34% 80% at 52% 100%,rgba(205,200,212,.24),transparent 72%),
    radial-gradient(ellipse 28% 65% at 84% 100%,rgba(215,210,220,.25),transparent 72%),
    linear-gradient(0deg,rgba(200,195,208,.18),transparent 70%);
  animation:fog 46s linear infinite}
.fog.b{bottom:-2%;height:34%;opacity:.8;               /* thinner wisps drifting the other way */
  background-image:
    radial-gradient(ellipse 22% 38% at 30% 70%,rgba(220,215,225,.10),transparent 75%),
    radial-gradient(ellipse 26% 42% at 72% 64%,rgba(220,215,225,.09),transparent 75%);
  animation:fog 70s linear infinite reverse}
@keyframes fog{from{transform:translateX(0)}to{transform:translateX(-50%)}}


canvas#dust{position:absolute;inset:0;z-index:5;pointer-events:none}

/* film grain (still, and behind the content so it never dulls the posters) */
.grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- CONTENT ---------- */
.content{position:absolute;inset:0;z-index:10;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;justify-items:center;padding:1.4vh 3vw 2vh}

/* header stays lit above the lights-out overlay, like a sign that never goes off */
header{position:relative;z-index:6;display:flex;flex-direction:column;align-items:center;gap:.5vh}
.logos{display:flex;align-items:center;justify-content:center;gap:2.4vh;height:5vh}
.logos span{height:100%;display:flex}
.logos img{height:100%;width:auto;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}
.logo-ph{height:100%;aspect-ratio:1;border:3px dashed rgba(255,255,255,.8);border-radius:50%;
  display:grid;place-items:center;font:600 1.3vh 'Oswald';letter-spacing:.15em;color:#fff;text-align:center;line-height:1.2}

/* NOW SHOWING: an old theatre neon sign that is failing, like the bulb frame.
   Most tubes burn steady; the "I" buzzes, and the "W" in NOW sometimes drops out
   (for a moment the sign reads "NO SHOWING"). */
:root{
  --tube-on:#ffdfe2;
  --glow-on:0 0 .12vh #fff,0 0 .7vh #ff5466,0 0 1.8vh #ff1f3d,0 0 4.2vh #c8102e,0 0 7vh rgba(200,16,46,.55);
  --tube-off:#64262d;     /* an unlit tube: dull glass, still visible */
}
h1{position:relative;display:inline-block;margin-top:.3vh;padding:.2vh 2.4vh .6vh;
  font-family:'Tilt Neon','Oswald',sans-serif;font-weight:400;font-size:min(7.4vh,10.5vw);line-height:1;letter-spacing:.12em;white-space:nowrap}   /* stays one line on phones */
/* no sign board: the tubes hang free, and their red light spills onto the curtain behind */
h1::before{content:"";position:absolute;inset:-70% -18%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(220,20,45,.22),rgba(160,10,30,.08) 55%,transparent 72%)}
.tube{color:var(--tube-on);text-shadow:var(--glow-on)}
.tube.buzz{animation:buzz 3.7s steps(1) infinite}
.tube.drop{animation:drop 6s steps(1) infinite}
@keyframes buzz{
  0%,8%,11%,47%,52%,100%{color:var(--tube-on);text-shadow:var(--glow-on)}
  6%,10%,46%,49%{color:var(--tube-off);text-shadow:none}}
@keyframes drop{   /* a quick stutter, then a longer "NO SHOWING" dropout, every 6 seconds */
  0%,21%,24%,61%,76%,100%{color:var(--tube-on);text-shadow:var(--glow-on)}
  20%,22%,60%,62%,74%{color:var(--tube-off);text-shadow:none}}

/* ---------- POSTERS + MARQUEE ---------- */
.carousel-wrap{width:100%;height:100%;min-height:0;padding:.8vh 0 1vh}
.carousel{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
/* frame height: the full poster area, but never wider than the screen (phones held upright) */
.carousel{--fh:min(100%,calc((94vw - var(--pad)*2)*1.5 + var(--pad)*2))}
.poster{position:absolute;height:calc(var(--fh) - var(--pad)*2);aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:#0b0004}
/* the whole poster is always shown, never cropped; if its shape differs from 2:3,
   a blurred copy of the same poster fills the gaps */
.poster .fill{position:absolute;inset:-6%;background:center/cover no-repeat;filter:blur(18px) brightness(.4)}
.poster img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.poster.current{z-index:3;transform:none;opacity:1}
.poster.current.reveal{animation:settle 1.6s cubic-bezier(.2,.8,.2,1)}
@keyframes settle{from{transform:scale(1.035)}to{transform:scale(1)}}
.poster.hidden{z-index:0;opacity:0}

/* red glow behind the poster (opacity only, so it is cheap to animate) */
.halo{position:absolute;z-index:2;height:var(--fh);border-radius:1.2vh;pointer-events:none;
  box-shadow:0 0 90px 12px rgba(255,30,50,.55),0 30px 80px rgba(0,0,0,.9);
  animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

/* the bulb frame: an old, rusted theatre sign that is failing */
.marquee{position:absolute;z-index:6;   /* above the lights-out layer: the sign stays on */
  height:var(--fh);pointer-events:none}
.marquee::before{content:"";position:absolute;inset:0;border-radius:.6vh;padding:var(--pad);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 .05  0 0 0 0 .03  0 0 0 0 .02  0 0 0 .9 -.25'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),
    repeating-linear-gradient(97deg,transparent 0 37px,rgba(150,110,80,.07) 37px 38px,transparent 38px 91px),
    radial-gradient(ellipse 30% 9% at 22% 2%,rgba(120,48,18,.7),transparent 70%),
    radial-gradient(ellipse 14% 26% at 99% 38%,rgba(105,40,14,.75),transparent 70%),
    radial-gradient(ellipse 28% 8% at 70% 99%,rgba(100,34,12,.7),transparent 70%),
    radial-gradient(ellipse 11% 22% at 1% 74%,rgba(90,32,10,.7),transparent 70%),
    radial-gradient(ellipse 8% 14% at 0% 12%,rgba(60,50,30,.6),transparent 70%),
    radial-gradient(ellipse 16% 6% at 45% 100%,rgba(20,14,8,.8),transparent 70%),
    linear-gradient(160deg,#1d0e0a 0%,#0b0504 45%,#180a07 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  box-shadow:0 0 0 1px rgba(120,70,40,.35),inset 0 0 .6vh rgba(0,0,0,.9)}

.bulb{position:absolute;width:1.5vh;height:1.5vh;margin:-.75vh 0 0 -.75vh;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#5a4030,#1e130c 70%);box-shadow:inset 0 0 .2vh #000}
.bulb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff3d0 0%,#ffc56a 45%,#d9661f 100%);
  box-shadow:0 0 .6vh .1vh rgba(255,150,70,.6),0 0 1.6vh .2vh rgba(255,80,30,.2);
  opacity:var(--age,.7);animation:hum var(--t) ease-in-out infinite;animation-delay:var(--d)}
/* working bulbs: dim, uneven, slowly wavering */
@keyframes hum{0%,100%{opacity:calc(var(--age,.7)*.82)}50%{opacity:var(--age,.7)}}   /* each bulb has its own fixed brightness */
/* tired bulbs: old filament, brown and dim */
.bulb.tired::after{background:radial-gradient(circle at 40% 35%,#f3dcb0 0%,#c98a3e 45%,#7a3a12 100%);
  box-shadow:0 0 .45vh .05vh rgba(220,130,60,.45)}
/* failing bulbs: three different stutter patterns, each bulb at its own speed */
.bulb.flicker::after{animation:stutter var(--t) steps(1) infinite;animation-delay:var(--d)}
.bulb.flicker.f2::after{animation-name:stutter2}
.bulb.flicker.f3::after{animation-name:stutter3}
@keyframes stutter{0%{opacity:.8}7%{opacity:.1}9%{opacity:.75}11%{opacity:.05}30%{opacity:.7}52%{opacity:.15}54%{opacity:.8}71%{opacity:0}74%{opacity:.6}76%{opacity:0}79%{opacity:.85}100%{opacity:.8}}
@keyframes stutter2{0%,40%,100%{opacity:.8}42%{opacity:.05}44%{opacity:.7}45%{opacity:.05}47%{opacity:.8}}            /* rare double blink */
@keyframes stutter3{0%{opacity:.75}10%{opacity:.25}12%{opacity:.8}25%{opacity:.4}27%{opacity:.75}60%{opacity:.08}64%{opacity:.3}66%{opacity:.05}70%{opacity:.8}}   /* weak, unsteady buzz */
/* dying bulbs: mostly dead, an occasional weak sputter */
.bulb.dying::after{animation:sputter var(--t) steps(1) infinite;animation-delay:var(--d)}
@keyframes sputter{0%{opacity:0}40%{opacity:.35}42%{opacity:0}44%{opacity:.5}45%{opacity:0}100%{opacity:0}}
/* a few bulbs glow a sick blood red */
.bulb.red::after{background:radial-gradient(circle at 40% 35%,#ffd0c8 0%,#ff3b2f 45%,#7a0a0a 100%);
  box-shadow:0 0 .7vh .15vh rgba(255,40,30,.7),0 0 2vh .3vh rgba(200,0,0,.3)}
/* missing bulbs: just an empty, dirty socket */
.bulb.missing{background:radial-gradient(circle,#030202 0 32%,#3a2a1e 38%,#1a110b 55%,#0c0705 72%);box-shadow:inset 0 0 .25vh #000}
.bulb.missing::after{display:none}
/* broken bulbs: dark, cracked glass */
.bulb.broken{background:radial-gradient(circle at 40% 35%,#2c2622,#0b0807 70%)}
.bulb.broken::after{animation:none;opacity:1;box-shadow:none;background:
  linear-gradient(var(--r),transparent 45%,rgba(200,190,180,.35) 47%,transparent 50%),
  linear-gradient(calc(var(--r) + 70deg),transparent 48%,rgba(200,190,180,.25) 50%,transparent 53%)}

/* placeholder poster art */
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  text-align:center;padding:8%;position:relative;
  background:
    radial-gradient(ellipse 60% 40% at 50% 38%,var(--c,#5a0a14) 0%,transparent 70%),
    linear-gradient(180deg,#120006 0%,#060002 100%)}
.ph::after{content:"";position:absolute;inset:3%;border:2px dashed rgba(255,255,255,.18);border-radius:6px}
.ph .n{font-family:'Creepster';font-size:14vh;line-height:1;color:rgba(255,255,255,.12)}
.ph .t{font:800 3vh 'Cinzel';letter-spacing:.12em;color:#e8d9cf}
.ph .s{font:400 1.8vh 'Oswald';letter-spacing:.3em;color:#a8968c}

/* ---------- CREDITS ---------- */
footer{display:flex;flex-direction:column;align-items:center;text-align:center}
/* fixed-height boxes: long titles/unit names shrink to fit (see fitCredits), so the
   poster and its bulb frame never change size between entries */
.presented{font:400 1.6vh 'Oswald';letter-spacing:.45em;color:var(--muted)}
.unit{height:3.1vh;max-width:70vw;text-transform:uppercase;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;
  font:600 2.5vh 'Oswald';letter-spacing:.24em;color:var(--blood-glow);text-shadow:0 0 10px rgba(255,0,30,.5)}
.sub{position:relative;z-index:6;white-space:nowrap;font:400 min(2.2vh,3.3vw) 'Oswald';letter-spacing:.22em;color:var(--ink);opacity:.85;margin-top:2.2vh;text-shadow:0 1px 6px #000,0 0 2px #000}

/* ---------- LIGHTS OUT between posters ---------- */
#dark{position:absolute;inset:0;z-index:5;background:#000;opacity:1;pointer-events:none;overflow:hidden}
#dark.out{animation:lightsOut .85s linear forwards}
#dark.in{animation:lightsIn 1.1s linear forwards}
@keyframes lightsOut{0%{opacity:0}12%{opacity:.75}20%{opacity:.15}32%{opacity:.9}40%{opacity:.4}60%,100%{opacity:1}}
@keyframes lightsIn{0%,25%{opacity:1}32%{opacity:.35}38%{opacity:.95}50%{opacity:.15}56%{opacity:.6}100%{opacity:0}}

/* fullscreen hint */
#fsHint{position:absolute;top:1.4vh;right:1.4vw;z-index:40;font:400 1.4vh 'Oswald';letter-spacing:.2em;
  color:rgba(255,255,255,.7);background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);padding:.6vh 1vw;border-radius:4px;transition:opacity .5s}
#fsHint.gone{opacity:0;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0s !important;animation-iteration-count:1 !important}
  #dark{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="curtain"></canvas>
  <div class="vignette"></div>
  <div class="spot"></div>
  <div class="fog a"></div>
  <div class="fog b"></div>

  <canvas id="dust"></canvas>

  <div class="content">
    <header>
      <div class="logos"><span id="logo1"></span><span id="logo2"></span></div>
      <h1 aria-label="NOW SHOWING"><span class="tube">NO</span><span class="tube drop">W</span> <span class="tube">SHOW</span><span class="tube buzz">I</span><span class="tube">NG</span></h1>
    </header>

    <div class="carousel-wrap">
      <div class="carousel" id="carousel">
        <div class="halo" id="halo"></div>
        <div class="marquee" id="marquee"></div>
      </div>
    </div>

    <footer>
      <div class="presented">PRESENTED BY</div>
      <div class="unit" id="unit"></div>
      <div class="sub" id="sub"></div>
    </footer>

    <div id="dark"><div class="fog a"></div><div class="fog b"></div></div>   <!-- fog copy: shows only while the lights are out -->
  </div>

  <div class="grain"></div>
  <div id="fsHint">CLICK ANYWHERE FOR FULLSCREEN</div>
</div>

<script src="posters.js"></script>   <!-- the poster list: made by "Update Posters.bat" from the posters folder -->
<script>
/* ==================================================================
   SETTINGS — edit these
   ================================================================== */
const SECONDS_PER_POSTER = 12;
const TAGLINE = "OWWA REGION 1 | HALLOWEEN 2026";   // shown under every poster

// Logos (white versions). Leave "" to show a placeholder circle.
const LOGOS = ["assets/owwa-logo-white.png", "assets/alagang-owwa-white.png"];

// The posters and their order come from posters.js, which "Update Posters.bat" writes
// from the files in the posters folder (named like "1 Education and Training Unit.png").
const POSTERS = (window.POSTERS && window.POSTERS.length) ? window.POSTERS : [{ image:"", unit:"" }];
/* ================================================================== */

const tints = ["#5a0a14","#2b1a4a","#0e3a2e","#4a2a08","#3a0a3a","#0a2a4a"];
document.getElementById("sub").textContent = TAGLINE;

// logos
LOGOS.forEach((src,i)=>{
  const slot=document.getElementById("logo"+(i+1));
  if(src){ const img=new Image(); img.src=src; img.alt="Logo"; slot.appendChild(img); }
  else { const d=document.createElement("div"); d.className="logo-ph"; d.innerHTML="LOGO<br>"+(i+1); slot.appendChild(d); }
});

// posters
const car=document.getElementById("carousel");
const els=POSTERS.map((p,i)=>{
  const el=document.createElement("div"); el.className="poster hidden";
  if(p.image){ el.innerHTML=`<div class="fill" style="background-image:url('${p.image}')"></div><img src="${p.image}" alt="${p.unit}">`; }
  else { el.innerHTML=`<div class="ph" style="--c:${tints[i%tints.length]}"><div class="n">${i+1}</div><div class="t">POSTER<br>PLACEHOLDER</div><div class="s">2 : 3 PORTRAIT</div></div>`; }
  car.appendChild(el);
  return el;
});

// bulb frame: sized to the poster. The damage is FIXED: the same bulbs are broken,
// missing, dying and flickering every time (positions are fractions of the way
// around the frame, clockwise from the top-left corner). Only each flickering
// bulb's rhythm is randomized.
const marquee=document.getElementById("marquee"), halo=document.getElementById("halo");
let bulbs=[], builtH=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const DAMAGE=[
  ["broken",.045],["broken",.215],["broken",.36],["broken",.385],["broken",.62],["broken",.875],   // .36 + .385: a dead patch
  ["missing",.13],["missing",.735],
  ["dying",.29],["dying",.505],["dying",.955],
  ["flicker",.08],["flicker",.17],["flicker",.25],["flicker",.33],["flicker",.43],
  ["flicker",.55],["flicker",.66],["flicker",.79],["flicker",.84],["flicker",.92],
];
// fixed per-bulb wear (same every time): brightness and a few tired, brownish bulbs
function wear(i){ let x=Math.sin((i+1)*12.9898)*43758.5453; x-=Math.floor(x); return x; }

function buildMarquee(){
  const H=marquee.clientHeight, pad=innerHeight*0.026; builtH=H;
  const W=(H-pad*2)*2/3+pad*2;
  marquee.style.width=halo.style.width=W+"px";
  marquee.querySelectorAll(".bulb").forEach(b=>b.remove());
  const x0=pad/2, y0=pad/2, x1=W-pad/2, y1=H-pad/2, gap=innerHeight*0.05;
  const sides=[[x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]];
  bulbs=[];
  for(const [ax,ay,bx,by] of sides){
    const n=Math.max(1,Math.round(Math.hypot(bx-ax,by-ay)/gap));
    for(let k=0;k<n;k++){
      const b=document.createElement("div"); b.className="bulb";
      b.style.left=(ax+(bx-ax)*k/n)+"px"; b.style.top=(ay+(by-ay)*k/n)+"px";
      marquee.appendChild(b); bulbs.push(b);
    }
  }
  // give each damage spot the nearest bulb that is still healthy
  const N=bulbs.length, state=new Array(N).fill("");
  for(const [kind,f] of DAMAGE){
    let best=-1, dist=9;
    for(let i=0;i<N;i++){ if(state[i]) continue; const d=Math.min(Math.abs(i/N-f),1-Math.abs(i/N-f)); if(d<dist){dist=d;best=i;} }
    if(best>=0) state[best]=kind;
  }
  bulbs.forEach((b,i)=>{
    const kind=state[i], w=wear(i);
    if(kind==="flicker"){
      b.classList.add("flicker","f"+(1+Math.floor(Math.random()*3)));          // random pattern...
      b.style.setProperty("--t",rnd(1.4,8)+"s");                                 // ...random speed...
      b.style.setProperty("--d",(-rnd(0,8))+"s");                                // ...random starting point
    }else if(kind){
      b.classList.add(kind);
      b.style.setProperty("--t",(6+w*6)+"s"); b.style.setProperty("--d",(-w*9)+"s");
    }else{
      if(w<.3) b.classList.add("tired");
      b.style.setProperty("--age",(.5+w*.38).toFixed(2));                        // uneven, fixed brightness
      b.style.setProperty("--t",(3+w*4)+"s"); b.style.setProperty("--d",(-w*7)+"s");
    }
    b.style.setProperty("--r",Math.round(w*180)+"deg");                          // crack angle
  });
}
// rebuild whenever the poster area changes size (window resize, fonts finishing loading)
let rT; new ResizeObserver(()=>{clearTimeout(rT);rT=setTimeout(buildMarquee,60)}).observe(car);
buildMarquee(); document.fonts.ready.then(buildMarquee);

// show a poster: flicker the lights out, swap everything in the dark, flicker back on
const unitEl=document.getElementById("unit"), dark=document.getElementById("dark");

// shrink a long unit name until it fits on one line
function fitText(el,maxWfrac,startVh,minVh){
  const vh=innerHeight/100, maxW=innerWidth*maxWfrac;
  for(let v=startVh; v>=minVh; v-=0.1){ el.style.fontSize=v*vh+"px"; if(el.scrollWidth<=maxW+1) return; }
}
function fitCredits(){
  const uw=innerWidth<innerHeight?0.94:0.70;              // phone held upright: use more of the width
  unitEl.style.maxWidth=uw*100+"vw";
  fitText(unitEl,uw,2.5,1.5);
}

// fixed order: the posters play in their number order (1, 2, 3 ...) and loop
const n=POSTERS.length;
let pos=0, idx=0, timer, busy=false;

function place(p){
  pos=p; idx=p;
  els.forEach((el,k)=>{
    el.className="poster "+(k===idx?"current reveal":"hidden");   // one feature at a time, center stage
  });
  unitEl.textContent=POSTERS[idx].unit || "UNIT NAME";
  fitCredits();
  if(marquee.clientHeight!==builtH) buildMarquee();   // safety net: re-measure if the layout settled late
}
function step(dir){
  let p=pos+dir;
  if(p>=n) p=0;
  if(p<0) p=n-1;
  return p;
}
function lights(cls){ dark.className=""; void dark.offsetWidth; dark.className=cls; }
function show(p,first){
  clearTimeout(timer);
  if(first){ place(p); lights("in"); }
  else{
    if(busy) return; busy=true;
    lights("out");
    setTimeout(()=>{ place(p); lights("in"); busy=false; },900);
  }
  timer=setTimeout(()=>show(step(1)),SECONDS_PER_POSTER*1000);
}
place(0);          // first poster waits behind the dark until the show starts (see startShow)
document.fonts.ready.then(fitCredits);
addEventListener("resize",fitCredits);

// fullscreen: browsers only allow it after a click or key press,
// so the first click/key anywhere switches to fullscreen.
// (Use "Start Now Showing.bat" to open it already fullscreen.)
const fsHint=document.getElementById("fsHint");
// phones and tablets (touch screens) skip this: most can't go fullscreen, and a tap shouldn't change the view
const canFull=!!document.documentElement.requestFullscreen && matchMedia("(pointer:fine)").matches;
function goFull(){ if(canFull && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }
function syncHint(){ fsHint.classList.toggle("gone", !canFull || !!document.fullscreenElement || innerHeight>=screen.height-2); }
addEventListener("pointerdown",goFull);
addEventListener("keydown",e=>{ if(e.key!=="Escape" && e.key.toLowerCase()!=="f") goFull(); });
document.addEventListener("fullscreenchange",syncHint); addEventListener("resize",syncHint); syncHint();

// the show starts as soon as the page opens: the lights flicker on to the first poster
let started=false;
function startShow(){ if(started) return; started=true; show(0,true); }
startShow();
// keyboard: -> / Page Down = next, <- / Page Up = previous (presentation clickers work too); F toggles fullscreen
addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="f"){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); return; }
  if((e.key==="ArrowRight"||e.key==="PageDown") && !busy) show(step(1));
  if((e.key==="ArrowLeft"||e.key==="PageUp") && !busy) show(step(-1));
});
// hide cursor when idle
let idleT; addEventListener("mousemove",()=>{document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add("idle"),2500)});

// ---------- VELVET CURTAIN ----------
// Drawn small (folds are soft, so it scales up cleanly) and redrawn ~30 times a second.
(function curtain(){
  const c=document.getElementById("curtain"), g=c.getContext("2d");
  const CW=480, CH=270; c.width=CW; c.height=CH;
  const img=g.createImageData(CW,CH), px=new Uint32Array(img.data.buffer);

  // fold profile: uneven fold widths, rounded crests, deep valleys
  const L=4096, lut=new Float32Array(L);
  let pos=0, seed=7; const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  while(pos<L){
    const w=Math.round(L*(0.022+r()*0.03)), amp=0.7+r()*0.3;
    for(let k=0;k<w&&pos<L;k++,pos++){ const t=k/w; lut[pos]=amp*Math.pow(Math.sin(Math.PI*t),0.75); }
  }
  // shade = crest brightness + light catching the left-facing slope
  const shadeLut=new Float32Array(L);
  for(let i=0;i<L;i++){ const d=lut[(i+1)%L]-lut[(i-1+L)%L]; shadeLut[i]=Math.min(1,Math.pow(lut[i],1.5)*0.82+Math.max(0,d)*22*0.18); }

  // velvet colour ramp: near-black valleys -> deep red -> soft pinkish sheen on crests
  const stops=[[0,8,0,2],[.3,52,2,9],[.6,112,8,22],[.85,165,22,40],[1,214,78,88]];
  const pal=new Uint32Array(256);
  for(let i=0;i<256;i++){
    const v=i/255; let a=stops[0],b=stops[stops.length-1];
    for(let k=0;k<stops.length-1;k++) if(v>=stops[k][0]&&v<=stops[k+1][0]){a=stops[k];b=stops[k+1];break;}
    const t=(v-a[0])/((b[0]-a[0])||1), m=(j)=>Math.round(a[j]+(b[j]-a[j])*t);
    pal[i]=(255<<24)|(m(3)<<16)|(m(2)<<8)|m(1);
  }

  // valance (top drape) with swags and a tarnished gold fringe
  const swagW=CW/7, vTop=CH*0.075, vDepth=CH*0.03;
  const vEdge=new Float32Array(CW);
  for(let x=0;x<CW;x++){ const f=(x%swagW)/swagW; vEdge[x]=vTop+vDepth*Math.pow(Math.sin(Math.PI*f),0.7); }

  const rowAmp=new Float32Array(CH), rowLight=new Float32Array(CH);
  for(let y=0;y<CH;y++){
    const v=y/CH;
    rowAmp[y]=0.75+0.25*v;                                      // the whole panel sways together, the hem a little more
    rowLight[y]=0.62+0.38*Math.sin(Math.PI*Math.min(1,v*1.25)); // darker at the rod and near the floor
  }
  const colW=new Float32Array(CW);
  // smooth lookup (blends between samples so folds glide instead of stepping)
  const shadeAt=(u)=>{ let f=(u-Math.floor(u))*L; const i=f|0, k=f-i; return shadeLut[i]*(1-k)+shadeLut[(i+1)%L]*k; };
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let last=0;
  function draw(ms){
    if(!still) requestAnimationFrame(draw);
    if(ms-last<33) return; last=ms;
    const t=ms/1000;
    for(let x=0;x<CW;x++){
      const xs=x/CW;
      // a slow side-to-side sway, made of two gentle drafts; no up/down movement
      colW[x]=Math.sin(t*0.35+xs*5.5)*0.0065+Math.sin(t*0.21+xs*9.0+1.3)*0.0025;
    }
    for(let y=0;y<CH;y++){
      const amp=rowAmp[y], li=rowLight[y];
      const row=y*CW;
      for(let x=0;x<CW;x++){
        const ey=vEdge[x];
        if(y<ey+1.6){
          if(y>=ey-0.4){                          // fringe
            const f=((x&1)?0.55:0.8)*(0.7+0.3*Math.sin(x*1.7));
            px[row+x]=(255<<24)|(Math.round(40*f)<<16)|(Math.round(95*f)<<8)|Math.round(140*f);
            continue;
          }
          const u=x/CW*3.1+0.37, vv=y/ey;           // valance: tighter pleats, sags between swags
          const sh=shadeAt(u)*(0.35+0.55*Math.sin(Math.PI*vv*0.9+0.15));
          px[row+x]=pal[Math.max(0,Math.min(255,(sh*235)|0))];
          continue;
        }
        const xs=x/CW;
        const disp=amp*colW[x];
        let u=xs+disp;     // folds stay perfectly vertical, so sideways sway never looks like up/down motion
        const seam=Math.abs(u-0.5);                 // the two panels meet in the middle
        let sh=shadeAt(u*0.999+1);
        if(seam<0.012) sh*=seam/0.012;
        px[row+x]=pal[Math.max(0,Math.min(255,(sh*li*255)|0))];
      }
    }
    g.putImageData(img,0,0);
  }
  requestAnimationFrame(draw);
})();

// floating dust / embers
const cv=document.getElementById("dust"), cx=cv.getContext("2d");
let W,H,parts=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
size(); addEventListener("resize",size);
for(let i=0;i<70;i++) parts.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,v:Math.random()*.0004+.0001,d:Math.random()*Math.PI*2,red:Math.random()<.35});
(function tick(t){
  cx.clearRect(0,0,W,H);
  for(const p of parts){
    p.y-=p.v; p.x+=Math.sin(t/3000+p.d)*.0003;
    if(p.y<-.02){p.y=1.02;p.x=Math.random();}
    const a=.25+.35*Math.abs(Math.sin(t/900+p.d));
    cx.beginPath(); cx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);
    cx.fillStyle=p.red?`rgba(255,60,60,${a})`:`rgba(230,220,210,${a*.6})`; cx.fill();
  }
  requestAnimationFrame(tick);
})(0);
</script>
